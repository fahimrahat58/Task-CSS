<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pricing</title>
    <link rel="stylesheet" href="pricecard/card.css">
</head>
<body>
     <header>
        <h1>Our Pricing Plans</h1>
        <p>Choose the plan that's right for you.</p>
    </header>

    <main>
        <section class="pricing-container">

            <!-- Basic Plan -->
            <article class="pricing-card">
                <h2>Basic</h2>
                <h3>$9/month</h3>

                <ul>
                    <li>✔1 Website</li>
                    <li>✔10 GB Storage</li>
                    <li>✔Email Support</li>
                </ul>

                <button class="button">Choose Plan</button>
            </article>

            <!-- Standard Plan -->
            <article class="pricing-cardnew">
                <h2>Standard</h2>
                <h3>$19/month</h3>

                <ul>
                    <li>✔5 Websites</li>
                    <li>✔50 GB Storage</li>
                    <li>✔Priority Support</li>
                </ul>

                <button class="button">Choose Plan</button>
            </article>

            <!-- Premium Plan -->
            <article class="pricing-card">
                <h2>Premium</h2>
                <h3>$39/month</h3>

                <ul>
                    <li>✔Unlimited Websites</li>
                    <li>✔Unlimited Storage</li>
                    <li>✔24/7 Support</li>
                </ul>

                <button class="button">Choose Plan</button>
            </article>

        </section>
    </main>

</body>
</html>
